<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AWS Book Management System</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
        padding: 30px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      button {
        border: none;
        padding: 11px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 8px;
      }

      .primary {
        background: #ff9900;
        color: white;
      }

      .secondary {
        background: #232f3e;
        color: white;
      }

      .danger {
        background: #dc3545;
        color: white;
      }

      button:hover {
        opacity: 0.9;
      }

      #message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 6px;
        display: none;
      }

      .success {
        background: #d4edda;
        color: #155724;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
      }

      .books-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .book-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 18px;
        background: #fafafa;
        overflow: hidden;
      }

      .book-image {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px;
        display: block;
        background: #e9ecef;
      }

      .no-image {
        width: 100%;
        height: 280px;
        background: #e9ecef;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        color: #777;
      }

      .book-card h3 {
        margin-bottom: 10px;
      }

      .book-card p {
        margin-bottom: 7px;
        color: #555;
      }

      .book-id {
        font-size: 11px;
        color: #777;
        word-break: break-all;
        margin-top: 10px;
      }

      .empty {
        color: #777;
        padding: 20px 0;
      }

      .loading {
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>📚 AWS Book Management System</h1>

      <p class="subtitle">API Gateway + AWS Lambda + Amazon S3</p>

      <!-- ADD BOOK -->
      <div class="card">
        <h2>Add New Book</h2>

        <br />

        <div class="form-group">
          <label for="title">Book Title</label>

          <input type="text" id="title" placeholder="Enter book title" />
        </div>

        <div class="form-group">
          <label for="author">Author</label>

          <input type="text" id="author" placeholder="Enter author name" />
        </div>

        <div class="form-group">
          <label for="price">Price</label>

          <input
            type="number"
            id="price"
            step="0.01"
            placeholder="Enter price"
          />
        </div>

        <div class="form-group">
          <label for="image">Book Image</label>

          <input
            type="file"
            id="image"
            accept="image/png,image/jpeg,image/webp"
          />
        </div>

        <button class="primary" onclick="addBook()">Add Book</button>

        <div id="message"></div>
      </div>

      <!-- BOOK LIST -->
      <div class="card">
        <div class="books-header">
          <h2>Books</h2>

          <button class="secondary" onclick="loadBooks()">Refresh Books</button>
        </div>

        <div id="booksList" class="books-grid">
          <p class="loading">Loading books...</p>
        </div>
      </div>
    </div>

    <script>
      // ==================================================
      // API GATEWAY URL
      // ==================================================

      const API_URL =
        "https://u0tpxkr8g4.execute-api.us-east-1.amazonaws.com/dev";

      // ==================================================
      // SHOW MESSAGE
      // ==================================================

      function showMessage(message, type) {
        const messageBox = document.getElementById("message");

        messageBox.textContent = message;

        messageBox.className = type;

        messageBox.style.display = "block";
      }

      // ==================================================
      // CONVERT IMAGE TO BASE64
      // ==================================================

      function imageToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();

          reader.onload = () => {
            const result = reader.result;

            const base64 = result.split(",")[1];

            resolve(base64);
          };

          reader.onerror = () => {
            reject(new Error("Failed to read image."));
          };

          reader.readAsDataURL(file);
        });
      }

      // ==================================================
      // ADD BOOK
      // POST /books
      // ==================================================

      async function addBook() {
        try {
          const title = document.getElementById("title").value.trim();

          const author = document.getElementById("author").value.trim();

          const price = parseFloat(document.getElementById("price").value);

          const imageInput = document.getElementById("image");

          const image = imageInput.files[0];

          // ------------------------------
          // Validation
          // ------------------------------

          if (!title) {
            showMessage("Please enter the book title.", "error");

            return;
          }

          if (!author) {
            showMessage("Please enter the author.", "error");

            return;
          }

          if (isNaN(price)) {
            showMessage("Please enter a valid price.", "error");

            return;
          }

          if (!image) {
            showMessage("Please select an image.", "error");

            return;
          }

          // ------------------------------
          // Convert image
          // ------------------------------

          showMessage("Uploading book...", "success");

          const base64Image = await imageToBase64(image);

          // ------------------------------
          // Create request
          // ------------------------------

          const requestBody = {
            title: title,

            author: author,

            price: price,

            images: [
              {
                content_type: image.type,

                data: base64Image,
              },
            ],
          };

          // ------------------------------
          // POST request
          // ------------------------------

          const response = await fetch(`${API_URL}/books`, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(requestBody),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Failed to add book.");
          }

          // ------------------------------
          // Success
          // ------------------------------

          showMessage(
            `Book added successfully. Book ID: ${result.book_id}`,
            "success",
          );

          // Clear form

          document.getElementById("title").value = "";

          document.getElementById("author").value = "";

          document.getElementById("price").value = "";

          document.getElementById("image").value = "";

          // Refresh books

          loadBooks();
        } catch (error) {
          console.error(error);

          showMessage(error.message || "Something went wrong.", "error");
        }
      }

      // ==================================================
      // LOAD ALL BOOKS
      // GET /books
      // ==================================================

      async function loadBooks() {
        const booksList = document.getElementById("booksList");

        booksList.innerHTML = `
            <p class="loading">
                Loading books...
            </p>
            `;

        try {
          const response = await fetch(`${API_URL}/books`);

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Failed to load books.");
          }

          const books = result.books || [];

          if (books.length === 0) {
            booksList.innerHTML = `
                    <p class="empty">
                        No books found.
                    </p>
                    `;

            return;
          }

          booksList.innerHTML = "";

          books.forEach((book) => {
            const card = document.createElement("div");

            card.className = "book-card";

            // ----------------------------------
            // IMAGE
            // ----------------------------------

            let imageHTML = "";

            if (book.image_urls && book.image_urls.length > 0) {
              imageHTML = `
                            <img
                                class="book-image"
                                src="${book.image_urls[0]}"
                                alt="${escapeHtml(book.title)}"
                            >
                        `;
            } else {
              imageHTML = `
                            <div class="no-image">
                                No Image
                            </div>
                        `;
            }

            // ----------------------------------
            // BOOK CARD
            // ----------------------------------

            card.innerHTML = `

                        ${imageHTML}

                        <h3>
                            ${escapeHtml(book.title)}
                        </h3>

                        <p>
                            <strong>
                                Author:
                            </strong>

                            ${escapeHtml(book.author)}
                        </p>

                        <p>
                            <strong>
                                Price:
                            </strong>

                            ₹${book.price}
                        </p>

                        <p>
                            <strong>
                                Images:
                            </strong>

                            ${book.image_uris ? book.image_uris.length : 0}
                        </p>

                        <p class="book-id">

                            <strong>
                                Book ID:
                            </strong>

                            <br>

                            ${escapeHtml(book.book_id)}

                        </p>

                        <br>

                        <button
                            class="secondary"
                            onclick='viewBook("${book.book_id}")'
                        >
                            View
                        </button>

                        <button
                            class="danger"
                            onclick='deleteBook("${book.book_id}")'
                        >
                            Delete
                        </button>

                    `;

            booksList.appendChild(card);
          });
        } catch (error) {
          console.error(error);

          booksList.innerHTML = `
                <p class="empty">

                    Failed to load books:

                    ${escapeHtml(error.message)}

                </p>
                `;
        }
      }

      // ==================================================
      // GET ONE BOOK
      // GET /books/{book_id}
      // ==================================================

      async function viewBook(bookId) {
        try {
          const response = await fetch(`${API_URL}/books/${bookId}`);

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Book not found.");
          }

          const book = result.book;

          // Use image URL if available
          const imageText =
            book.image_urls && book.image_urls.length > 0
              ? `\nImage available: Yes`
              : `\nImage available: No`;

          alert(
            `Book Details\n\n` +
              `Title: ${book.title}\n` +
              `Author: ${book.author}\n` +
              `Price: ₹${book.price}\n` +
              `Book ID:\n${book.book_id}` +
              imageText,
          );
        } catch (error) {
          alert(error.message);
        }
      }

      // ==================================================
      // DELETE BOOK
      // DELETE /books/{book_id}
      // ==================================================

      async function deleteBook(bookId) {
        const confirmed = confirm("Are you sure you want to delete this book?");

        if (!confirmed) {
          return;
        }

        try {
          const response = await fetch(`${API_URL}/books/${bookId}`, {
            method: "DELETE",
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Failed to delete book.");
          }

          showMessage("Book deleted successfully.", "success");

          loadBooks();
        } catch (error) {
          console.error(error);

          showMessage(error.message || "Failed to delete book.", "error");
        }
      }

      // ==================================================
      // ESCAPE HTML
      // ==================================================

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }

      // ==================================================
      // LOAD BOOKS WHEN PAGE OPENS
      // ==================================================

      loadBooks();
    </script>
  </body>
</html>
